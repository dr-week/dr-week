<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">DISHANT NAIK · Computer Engineer + Designer</title>
  <desc id="desc">Warm ivory typography on charcoal. An orange line drawing slowly changes from a rounded product form into an interface.</desc>
  <style>
    .form { animation: form 10s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .detail { animation: detail 10s ease-in-out infinite; }
    @keyframes form { 0%,15%,100% { rx: 54px; transform: rotate(-12deg); } 45%,65% { rx: 8px; transform: rotate(0deg); } }
    @keyframes detail { 0%,15%,100% { opacity: .1; } 45%,65% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .form,.detail { animation: none; } }
  </style>
  <rect width="1000" height="360" fill="#171817"/>
  <path d="M44 46H956M44 314H956" stroke="#393b36"/>
  <text x="44" y="82" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#b8b6aa">CRAFT / INDUSTRY / SOFTWARE</text>
  <text x="40" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#f1ede2">DISHANT</text>
  <text x="40" y="241" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#f1ede2">NAIK<tspan fill="#da9671">.</tspan></text>
  <text x="44" y="286" font-family="Arial, sans-serif" font-size="20" fill="#c1c0b5">Computer Engineer + Designer</text>
  <g transform="translate(720 104)" fill="none" stroke-width="1.5">
    <path d="M-24 0H194M-24 152H194M0-22V176M170-22V176" stroke="#3c3e37" stroke-dasharray="3 5"/>
    <rect class="form" width="170" height="152" rx="32" stroke="#da9671"/>
    <g class="detail" stroke="#a8ac9c">
      <path d="M18 35H152M18 56H65V131H18ZM82 61H148M82 77H138M82 93H145"/>
      <circle cx="23" cy="20" r="2"/><circle cx="34" cy="20" r="2"/>
    </g>
  </g>
</svg>
